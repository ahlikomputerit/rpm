name: Forest Depths Netlify Deploy

on:
  workflow_dispatch:
  push:
    branches: [forest-depths]
    paths:
      - "forest-depths/**"
      - ".github/workflows/forest-netlify.yml"
  pull_request:
    paths:
      - "forest-depths/**"
      - ".github/workflows/forest-netlify.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: forest-netlify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Netlify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forest-depths
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: forest-depths/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Build static client
        run: pnpm exec vite build

      - name: Install Netlify CLI
        run: pnpm add --global netlify-cli@latest
        working-directory: .

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        id: preview
        run: echo "url=$(netlify deploy --dir=dist/public --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).deploy_url))')" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.preview.outputs.url }}`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Forest Depths Netlify preview: ${url}`
            });

      - name: Deploy production
        if: github.event_name != 'pull_request'
        run: netlify deploy --dir=dist/public --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN --prod
